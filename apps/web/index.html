<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#283040" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141a28" media="(prefers-color-scheme: dark)" />
    <!-- Show a saved Light/Dark choice before the first paint (System leaves it to the device). -->
    <script>
      try {
        var theme = JSON.parse(localStorage.getItem('ptcg.settings') || '{}').theme;
        if (theme === 'dark' || theme === 'light') document.documentElement.dataset.theme = theme;
      } catch (e) {}
    </script>
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="PTCG" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Pokémon TCG</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
